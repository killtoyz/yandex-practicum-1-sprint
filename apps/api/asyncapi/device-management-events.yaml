asyncapi: 3.0.0
info:
  title: Device Management Events
  version: 1.0.0
  description: |
    События каталога устройств. Сервис публикует факты о жизненном цикле
    устройства; подписчики — Heating Control, Indicators Monitoring и
    Performance Monitoring. Издатель не знает состава подписчиков.
servers:
  broker:
    host: kafka:9092
    protocol: kafka
    description: Общий брокер сообщений экосистемы
channels:
  deviceRegistered:
    address: device.registered
    description: Устройство подключено к дому и внесено в каталог
    messages:
      deviceRegistered:
        $ref: '#/components/messages/DeviceRegistered'
  deviceUpdated:
    address: device.updated
    description: Изменены данные устройства (имя, помещение, статус)
    messages:
      deviceUpdated:
        $ref: '#/components/messages/DeviceUpdated'
  deviceRemoved:
    address: device.removed
    description: Устройство отключено и удалено из каталога
    messages:
      deviceRemoved:
        $ref: '#/components/messages/DeviceRemoved'
operations:
  sendDeviceRegistered:
    action: send
    channel:
      $ref: '#/channels/deviceRegistered'
    messages:
      - $ref: '#/channels/deviceRegistered/messages/deviceRegistered'
  sendDeviceUpdated:
    action: send
    channel:
      $ref: '#/channels/deviceUpdated'
    messages:
      - $ref: '#/channels/deviceUpdated/messages/deviceUpdated'
  sendDeviceRemoved:
    action: send
    channel:
      $ref: '#/channels/deviceRemoved'
    messages:
      - $ref: '#/channels/deviceRemoved/messages/deviceRemoved'
components:
  messages:
    DeviceRegistered:
      name: DeviceRegistered
      title: Устройство зарегистрировано
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: device_id — ключ партиционирования, гарантирует порядок событий устройства
      payload:
        $ref: '#/components/schemas/DeviceRegisteredPayload'
    DeviceUpdated:
      name: DeviceUpdated
      title: Данные устройства изменены
      contentType: application/json
      bindings:
        kafka:
          key: { type: string, format: uuid }
      payload:
        $ref: '#/components/schemas/DeviceUpdatedPayload'
    DeviceRemoved:
      name: DeviceRemoved
      title: Устройство удалено
      contentType: application/json
      bindings:
        kafka:
          key: { type: string, format: uuid }
      payload:
        $ref: '#/components/schemas/DeviceRemovedPayload'
  schemas:
    DeviceRegisteredPayload:
      type: object
      required: [event_id, occurred_at, device_id, house_id, type_id]
      properties:
        event_id: { type: string, format: uuid, description: Идентификатор события для дедупликации }
        occurred_at: { type: string, format: date-time, description: Время наступления события }
        device_id: { type: string, format: uuid }
        house_id: { type: string, format: uuid }
        room_id: { type: string, format: uuid }
        type_id: { type: string, format: uuid }
        serial_number: { type: string }
        modules:
          type: array
          items:
            type: object
            required: [module_id, kind, capability]
            properties:
              module_id: { type: string, format: uuid }
              kind: { type: string, enum: [measuring, actuating] }
              capability: { type: string, example: temperature }
              unit: { type: string, example: °C }
    DeviceUpdatedPayload:
      type: object
      required: [event_id, occurred_at, device_id]
      properties:
        event_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        device_id: { type: string, format: uuid }
        name: { type: string }
        room_id: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive, error] }
    DeviceRemovedPayload:
      type: object
      required: [event_id, occurred_at, device_id]
      properties:
        event_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        device_id: { type: string, format: uuid }
        house_id: { type: string, format: uuid }
