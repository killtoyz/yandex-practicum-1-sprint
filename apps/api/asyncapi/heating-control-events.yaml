asyncapi: 3.0.0
info:
  title: Heating Control Events
  version: 1.0.0
  description: |
    События управления отоплением. Сервис отправляет команду устройству через
    брокер и принимает подтверждение от шлюза устройств. Также следит за
    каталогом, чтобы не отправлять команды удалённым устройствам.
servers:
  broker:
    host: kafka:9092
    protocol: kafka
    description: Общий брокер сообщений экосистемы
channels:
  heatingCommandIssued:
    address: heating.command.issued
    description: Команда на изменение температуры, адресованная шлюзу устройств
    messages:
      heatingCommandIssued:
        $ref: '#/components/messages/HeatingCommandIssued'
  commandAcknowledged:
    address: command.acknowledged
    description: Подтверждение доставки и применения команды устройством
    messages:
      commandAcknowledged:
        $ref: '#/components/messages/CommandAcknowledged'
  deviceRegistered:
    address: device.registered
    description: Устройство появилось в каталоге
    messages:
      deviceRegistered:
        $ref: '#/components/messages/DeviceRegistered'
  deviceRemoved:
    address: device.removed
    description: Устройство удалено из каталога
    messages:
      deviceRemoved:
        $ref: '#/components/messages/DeviceRemoved'
operations:
  sendHeatingCommandIssued:
    action: send
    channel:
      $ref: '#/channels/heatingCommandIssued'
    messages:
      - $ref: '#/channels/heatingCommandIssued/messages/heatingCommandIssued'
  receiveCommandAcknowledged:
    action: receive
    channel:
      $ref: '#/channels/commandAcknowledged'
    messages:
      - $ref: '#/channels/commandAcknowledged/messages/commandAcknowledged'
  receiveDeviceRegistered:
    action: receive
    channel:
      $ref: '#/channels/deviceRegistered'
    messages:
      - $ref: '#/channels/deviceRegistered/messages/deviceRegistered'
  receiveDeviceRemoved:
    action: receive
    channel:
      $ref: '#/channels/deviceRemoved'
    messages:
      - $ref: '#/channels/deviceRemoved/messages/deviceRemoved'
components:
  messages:
    HeatingCommandIssued:
      name: HeatingCommandIssued
      title: Команда на изменение температуры
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: device_id — гарантирует порядок команд для одного устройства
      payload:
        $ref: '#/components/schemas/HeatingCommandIssuedPayload'
    CommandAcknowledged:
      name: CommandAcknowledged
      title: Команда подтверждена устройством
      contentType: application/json
      bindings:
        kafka:
          key: { type: string, format: uuid }
      payload:
        $ref: '#/components/schemas/CommandAcknowledgedPayload'
    DeviceRegistered:
      name: DeviceRegistered
      title: Устройство зарегистрировано
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DeviceRefPayload'
    DeviceRemoved:
      name: DeviceRemoved
      title: Устройство удалено
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DeviceRefPayload'
  schemas:
    HeatingCommandIssuedPayload:
      type: object
      required: [command_id, occurred_at, device_id, module_id, target_value, unit, version]
      properties:
        command_id: { type: string, format: uuid, description: Ключ дедупликации при повторной доставке }
        occurred_at: { type: string, format: date-time }
        device_id: { type: string, format: uuid }
        module_id: { type: string, format: uuid }
        target_value: { type: number, format: double, example: 22.5 }
        unit: { type: string, example: °C }
        mode: { type: string, enum: [manual, auto, off] }
        version: { type: integer, description: Версия уставки, растёт при каждом изменении, example: 7 }
    CommandAcknowledgedPayload:
      type: object
      required: [command_id, occurred_at, device_id, status]
      properties:
        command_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        device_id: { type: string, format: uuid }
        status: { type: string, enum: [delivered, acknowledged, failed] }
        delivered_at: { type: string, format: date-time }
        error: { type: string, description: Причина отказа, если status = failed }
    DeviceRefPayload:
      type: object
      required: [event_id, occurred_at, device_id]
      properties:
        event_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        device_id: { type: string, format: uuid }
        house_id: { type: string, format: uuid }
