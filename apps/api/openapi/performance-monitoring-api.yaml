openapi: 3.0.3
info:
  title: Performance Monitoring API
  description: |
    Состояние и доступность устройств. Данные накапливаются асинхронно
    из события device.heartbeat; чтение — синхронное.
  version: 1.0.0
servers:
  - url: https://api.smarthome.example/api/v1
    description: Через API-шлюз
tags:
  - name: health
paths:
  /devices/{deviceId}/health:
    get:
      tags: [health]
      summary: Состояние устройства
      operationId: getDeviceHealth
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Последнее известное состояние устройства
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceHealth' }
        '404':
          description: Состояние устройства ещё не зафиксировано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DeviceHealth:
      type: object
      required: [device_id, state, updated_at]
      properties:
        device_id: { type: string, format: uuid }
        state: { type: string, enum: [online, offline, degraded] }
        last_seen_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - bearerAuth: []
